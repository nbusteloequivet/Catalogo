<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo — Laboratorio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <!-- Nombre y bajada del laboratorio: se completan solos desde
         CONFIG.LAB_NAME / CONFIG.LAB_SUBTITLE en script.js -->
    <div class="brand">
      <h1 id="lab-name">Catálogo de Productos</h1>
      <p class="brand-sub" id="lab-sub">Actualizado desde planilla</p>
    </div>
  </div>

  <!-- Buscador arriba, categorías debajo (se acumulan en filas si no entran) -->
  <div class="filter-row">
    <input type="text" id="search-input" placeholder="Buscar producto, código, categoría o laboratorio…" autocomplete="off">
    <div id="category-chips" class="category-chips"></div>
  </div>
</header>

<main id="main-content">
  <div id="status-banner" class="status-banner" hidden></div>
  <div id="catalog-grid" class="catalog-grid"></div>
  <div id="empty-state" class="empty-state" hidden>
    <p>No hay productos que coincidan con la búsqueda.</p>
  </div>
</main>

<footer class="site-footer">
  <p>Este catálogo se lee en vivo desde una planilla de Google Sheets.</p>
</footer>

<!-- Modal de detalle: un solo bloque reutilizado para cualquier producto.
     Arranca oculto (hidden) y script.js le carga el contenido al clickear una tarjeta. -->
<div id="product-modal" class="modal-overlay" hidden>
  <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button id="modal-close" class="modal-close" aria-label="Cerrar">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="script.js"></script>
</body>
</html>
